<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADAD YATRA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    
    <header>
        <div class="logo">
            <i class="fas fa-bus"></i> MADAD YATRA
        </div>
        <nav>
            <a href="#" class="nav-btn">SIGN IN</a>
            <a href="#" class="nav-btn">LOG IN</a>
            <a href="#" class="nav-btn">BOOK NOW</a>
        </nav>
    </header>

    
    <section class="hero">
        <form class="search-box" method="POST" action="/">
            <div class="field">
                <i class="fas fa-location-dot"></i>
                <input type="text" name="start" placeholder="Starting Point" required>
            </div>
            <div class="field">
                <i class="fas fa-route"></i>
                <input type="text" name="destination" placeholder="Destination" required>
            </div>
            <button type="submit">
                <i class="fas fa-magnifying-glass"></i> Search
            </button>
        </form>
    </section>

    
    <section class="result">
        <h2><i class="fas fa-bus"></i> Available Bus Routes</h2>
        <div class="result-box">
            {{ result_html | safe }}
        </div>
    </section>

</body>
</html>
